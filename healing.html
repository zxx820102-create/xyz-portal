};
const LIVE_SOURCE = null; // v2 预留位（见上）
const OFFLINE_KEY  = 'xyz-healing:offline';   // 离线降级：本机累计
const LIT_KEY      = 'xyz-healing:lit';       // 点亮状态（本次会话）
const THEME_KEY    = 'xyz-healing:theme';     // 手动主题偏好
const HEARTBEAT_MS = 30000;                   // 30 秒心跳
const PREFERS_REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE = matchMedia('(max-width: 640px)').matches;
const HEART_CAP   = MOBILE ? 26 : 42;         // 环上心数上限（性能&美感）
const HEART_START = MOBILE ? 10 : 14;         // 初始象征心数（真实数在计数区）
const MY_ANGLE = 25;                          // 你的心在环上的位置（右上象限）

const $ = s => document.querySelector(s);
const ringEl = $('#ring'), odoEl = $('#odo'), whisperEl = $('#whisper'),
      lightBtn = $('#lightBtn'), litMsg = $('#litMsg'), offlineTag = $('#offlineTag');

/* —— 稳定伪随机（固定种子：所有人看到同一副环 = 同一数字的具象） —— */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(20260820);

/* ══════════ 心光环 ══════════ */
const HEART_PATH = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
const heartsOnRing = [];  // {angle}
let myHeartEl = null;

function setOrbit(){
  ringEl.style.setProperty('--orbit', (ringEl.clientWidth / 2) + 'px');
}
function placeTransform(angle, f, extra){
  return 'translate(-50%,-50%) rotate(' + angle + 'deg)' +
         ' translate(calc(var(--orbit) * ' + f + '))' +
         ' rotate(' + (-angle) + 'deg)' + (extra || '');
}
function makeHeart(kind, angle, opts){
  opts = opts || {};
  const el = document.createElement('span');
  el.className = 'heart ' + (kind === 'me' ? 'rose' : (rng() < .55 ? 'rose' : 'gold'));
  const size = opts.size || (kind === 'me' ? 17 : 9 + Math.round(rng() * 6));
  el.innerHTML = '<span class="hf" style="--d:' + (2.6 + rng() * 2.6).toFixed(2) +
                 's;--dl:-' + (rng() * 4).toFixed(2) + 's">' +
                 '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true"><path d="' + HEART_PATH + '"/></svg></span>';
  const f = (0.94 + rng() * 0.12).toFixed(3);
  el.dataset.angle = angle; el.dataset.f = f;
  el.style.transform = placeTransform(angle, f, opts.riseFrom ? ' translateY(' + opts.riseFrom + 'vh)' : '');
  el.style.opacity = opts.riseFrom ? '0' : '1';
  ringEl.appendChild(el);
  heartsOnRing.push({angle});
  return el;
}
function buildRing(){
  setOrbit();
  // 初始象征心：均匀分布 + 微抖动；给你的心让出 MY_ANGLE 附近的空位
  let placed = 0, i = 0;
  while (placed < HEART_START && i < HEART_START * 4){
    const angle = (i * (360 / HEART_START) + (rng() * 8 - 4) + 360) % 360;
    i++;
    const d = Math.abs(angle - MY_ANGLE);
    if (Math.min(d, 360 - d) < 13) continue;         // 为你的心留空
    if (heartsOnRing.some(h => { const dd = Math.abs(h.angle - angle); return Math.min(dd, 360 - dd) < 7; })) continue;
    makeHeart('peer', angle);
    placed++;
  }
  // 你的心：先沉在屏幕底部，加载后升起加入环带（600ms——你就是被看见的那一个）
  myHeartEl = makeHeart('me', MY_ANGLE, {size: 17, riseFrom: 62});
  setTimeout(function(){
    myHeartEl.style.transform = placeTransform(MY_ANGLE, myHeartEl.dataset.f);
    myHeartEl.style.opacity = '1';
  }, 380);
}
/* 数字增长（别人也在打开）→ 新心升起：远隔天边共见同一数字的连接感 */
function riseNewHearts(n){
  for (let k = 0; k < n; k++){
    if (heartsOnRing.length >= HEART_CAP) break;
    let angle, ok = false;
    for (let t = 0; t < 40 && !ok; t++){
      angle = Math.round(rng() * 360);
      ok = heartsOnRing.every(h => { const dd = Math.abs(h.angle - angle); return Math.min(dd, 360 - dd) > 8; });
    }
    if (!ok) break;
    const el = makeHeart('peer', angle, {riseFrom: 26});
    setTimeout(function(){
      el.style.transform = placeTransform(angle, el.dataset.f);
      el.style.opacity = '1';
    }, 120 + k * 240);
  }
}

/* ══════════ 计数（真实 · 降级链） ══════════ */
let count = 0, online = false;

async function fetchJSON(url, timeoutMs){
  const ac = new AbortController();
  const timer = setTimeout(function(){ ac.abort(); }, timeoutMs || 8000);
  try{
    const r = await fetch(url, {signal: ac.signal, cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}
function setCount(n, opts){
  opts = opts || {};
  if (n === count && !opts.force) return;
  count = n;
  renderOdo(n);
  if (opts.pulse !== false && !PREFERS_REDUCE){
    odoEl.classList.remove('pulse');
    void odoEl.offsetWidth;              // 重启动画
    odoEl.classList.add('pulse');
  }
}
/* 里程计式数字滚动：每位一列 0–9，translateY 滚到目标位 */
function renderOdo(n){
  const s = String(n);
  const cols = odoEl.querySelectorAll('.col');
  if (cols.length !== s.length){          // 位数变化：重建后从 0 滚到 N
    odoEl.innerHTML = '';
    for (const ch of s){
      const dgt = document.createElement('span'); dgt.className = 'dgt';
      const col = document.createElement('span'); col.className = 'col';
      for (let i = 0; i < 10; i++){ const b = document.createElement('b'); b.textContent = i; col.appendChild(b); }
      dgt.appendChild(col); odoEl.appendChild(dgt);
    }
  }
  const list = odoEl.querySelectorAll('.col');
  const apply = function(){
    for (let i = 0; i < s.length; i++) list[i].style.transform = 'translateY(-' + (Number(s[i]) * 10) + '%)';
  };
  if (PREFERS_REDUCE){ apply(); }
  else requestAnimationFrame(function(){ requestAnimationFrame(apply); });
}
async function initCount(){
  try{
    const j = await fetchJSON(ABACUS.hit, 8000);        // 你打开的这一秒：+1
    online = true;
    setCount(Number(j.value) || 1, {force: true});
  } catch(e){
    /* 降级：离线本机累计（诚实明示，不冒充全局） */
    let n = 0;
    try{ n = parseInt(localStorage.getItem(OFFLINE_KEY) || '0', 10) || 0; }catch(_){}
    n += 1;
    try{ localStorage.setItem(OFFLINE_KEY, String(n)); }catch(_){}
    offlineTag.hidden = false;
    setCount(n, {force: true});
  }
}
async function heartbeat(){
  if (!online) return;                                   // 离线模式：不再轮询，保持诚实
  try{
    const j = await fetchJSON(ABACUS.get, 8000);         // 只读：挂机绝不刷量
    const v = Number(j.value) || 0;
    if (v > count){
      const d = v - count;
      setCount(v, {force: true});
      riseNewHearts(Math.min(d, 3));                     // 每颗升起的星 = 一次真实的抵达
    }
  }catch(e){ /* 心跳失败静默：保持当前数字，等待下一次 */ }
}
setInterval(heartbeat, HEARTBEAT_MS);
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) heartbeat();                     // 回前台即刻感知：别人也在打开
});

/* ══════════ 星空 ══════════ */
function buildStars(){
  const layers = document.querySelectorAll('.starlayer .dot');
  const mk = function(n, maxOp){
    let s = [];
    for (let i = 0; i < n; i++){
      s.push((rng() * 100).toFixed(2) + 'vw ' + (rng() * 100).toFixed(2) + 'vw 0 ' +
             (rng() < .3 ? '0.5px' : '0px') +
             ' rgba(255,255,255,' + (maxOp * (0.35 + rng() * 0.65)).toFixed(2) + ')');
    }
    return s.join(',');
  };
  layers[0].style.boxShadow = mk(MOBILE ? 60 : 95, .8);
  layers[1].style.boxShadow = mk(MOBILE ? 40 : 60, .5);
}

/* ══════════ 疗愈语轮播（8 句 · 温柔不煽情） ══════════ */
const WHISPERS = [
  '深夜醒着的不止你一个。',
  '此刻，地球另一端也有人刚打开这页。',
  '你被看见了。',
  '我们同在这一秒的星空下。',
  '有人在这里留下一颗心，然后继续生活。',
  '这个数字每 +1，都是一次真实的抵达。',
  '允许自己停下来，就是疗愈的开始。',
  '这颗星球转了四十六亿年，今晚也载着你。'
];
let wi = 0;
function showWhisper(step){
  whisperEl.style.opacity = '0';
  setTimeout(function(){
    wi = (wi + step + WHISPERS.length) % WHISPERS.length;
    whisperEl.textContent = WHISPERS[wi];
    whisperEl.style.opacity = '1';
  }, PREFERS_REDUCE ? 0 : 1000);
}
function startWhisper(){
  whisperEl.textContent = WHISPERS[0];
  if (!PREFERS_REDUCE) setInterval(function(){ showWhisper(1); }, 8000);
  whisperEl.addEventListener('click', function(){ showWhisper(1); }); // 降级/想看下一句：轻触
}

/* ══════════ 点亮我的心（本次会话） ══════════ */
function lightUp(silent){
  myHeartEl.classList.add('lit');
  lightBtn.disabled = true;
  lightBtn.textContent = '已点亮';
  try{ sessionStorage.setItem(LIT_KEY, '1'); }catch(_){}
  if (silent) return;
  litMsg.classList.add('show');
  setTimeout(function(){ litMsg.classList.remove('show'); }, 10000);
}
lightBtn.addEventListener('click', function(){ lightUp(false); });
try{ if (sessionStorage.getItem(LIT_KEY) === '1') lightUp(true); }catch(_){}

/* ══════════ 日夜主题 ══════════ */
const htmlEl = document.documentElement;
function applyTheme(t){
  htmlEl.dataset.theme = t;
  document.body.dataset.theme = t;
}
applyTheme(htmlEl.dataset.theme || 'night');
$('#themeBtn').addEventListener('click', function(){
  const next = htmlEl.dataset.theme === 'night' ? 'day' : 'night';
  applyTheme(next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(_){}
});

/* ══════════ 启动 ══════════ */
buildStars();
buildRing();
renderOdo(0);
initCount();
startWhisper();
let rz;
window.addEventListener('resize', function(){
  clearTimeout(rz);
  rz = setTimeout(setOrbit, 120);       // --orbit 更新后所有心的 transform 自动重排
});

/* v2：实时在场数据源接入点（当前禁用）
if (LIVE_SOURCE) { LIVE_SOURCE.connect(...); } */
</script>
</body>
