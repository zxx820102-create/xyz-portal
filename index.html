<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAF6EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060913" media="(prefers-color-scheme: dark)">
<meta name="description" content="XYZ · 苹果环面——爱因斯坦-罗森桥的真结构：上半凹陷是黑洞（星尘沿 z=∓k/r 漏斗加速坠入），腰部最窄一圈是虫洞喉咙 r₀（点击整座苹果莫比乌斯翻面，内外互换），黄金螺线管绕苹果盘旋（一圈翻到管道另一侧·两圈归位），下半张开是白洞（星流减速喷出、飘散、再被捕获——一个真正的闭环）。12 尺度刻度与 26 产物嵌在管上，点击绽放直达。自包含单文件·零依赖（唯疗愈厅同在计数一次匿名只读读取）。">
<title>XYZ · 苹果环面 · 爱因斯坦-罗森桥 —— 宇宙认识自己的界面</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23D4A94E' d='M32 2 39 25 62 32 39 39 32 62 25 39 2 32 25 25Z'/%3E%3C/svg%3E">
<style>
  /* ==========================================================
     XYZ 门户 v5 · 苹果环面（2026-08-20·真结构重建）
     真结构 = 苹果状环面 + 内含螺旋 + 莫比乌斯翻面：
     ① ER 桥嵌入图剖面：上叶 z=-k/r 漏斗（远处平坦·向喉凹陷）
        在喉咙半径 r0 连接下叶镜像 z=+k/r（张开）——旋转体生成苹果：
        上半凹陷=黑洞区 · 腰部最窄圆=虫洞喉咙 r0 · 下半张开=白洞区
     ② 表面渲染=经纬等高线（物理教科书嵌入图·克鲁斯卡尔美感）：
        上叶纬线密（黑洞压缩感）·下叶经线放射+喷发脉冲（白洞喷发感）
     ③ 环面黄金螺线管嵌在苹果表面：大环角 θ=5·2π·s 绕轴、小环角
        ψ=2π·s 绕剖面；莫比乌斯标架 n(s+1)=-n(s)（一圈翻到管道另一侧）
        ·两圈归位；外侧段（黑洞侧）亮·内侧段（白洞侧）柔
     ④ 闭环流动（单池四相）：上叶外星尘坠入（加速·近喉最亮）→过喉
        →入螺线管绕行（经停尺度节点·节点被经过时发亮）→下叶沿壁喷出
        （减速·张开发散）→外部飘散淡去→再被上叶捕获——真正的闭环
     ⑤ 交互：拖拽=3D 轨道旋转（惯性）·点喉=莫比乌斯翻面 800ms·
        点螺线节点=绽放面板直达 26 产物·点下漏斗=外送视图·滚轮=缩放
     审美军规：恰 5 色 token（deep/bright/gold/cinnabar/ink）·
        白洞=未观测数学解→METAPHOR 注脚（诚实律）·reduced-motion 全降级
     自包含单文件 · 零外部依赖
     ========================================================== */
  :root{ /* 恰 5 个颜色 token（日夜两套值·名字不变） */
    --deep:#060913;     /* 深空 */
    --bright:#F2EDDF;   /* 星白 */
    --gold:#D9B46B;     /* φ金 */
    --cinnabar:#C8452B; /* 朱砂 */
    --ink:#0C0A07;      /* 墨 */
  }
  body.day{
    --deep:#E7DFCC;
    --bright:#FAF6EC;
    --gold:#8E691F;
    --cinnabar:#B23A22;
    --ink:#221D14;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;color:var(--bright);
    font-family:Georgia,'Songti SC','Noto Serif SC','Source Han Serif SC','Times New Roman',serif;
    font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1300px 900px at 76% 14%, rgba(120,96,150,.14), transparent 62%),
      radial-gradient(1000px 760px at 16% 86%, rgba(46,92,122,.12), transparent 60%),
      radial-gradient(720px 560px at 52% 50%, rgba(217,180,107,.05), transparent 66%),
      linear-gradient(180deg,#060913 0%,#080D1C 55%,#0A1122 100%);
  }
  body.day{
    background:
      radial-gradient(1300px 900px at 76% 14%, rgba(142,105,31,.07), transparent 62%),
      radial-gradient(1000px 760px at 16% 86%, rgba(120,95,60,.07), transparent 60%),
      linear-gradient(180deg,#FAF6EC 0%,#F4EEDD 52%,#EDE4CE 100%);
  }
  ::selection{background:rgba(217,180,107,.28)}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}

  /* ---------- 画布舞台 ---------- */
  #sky{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #sky.grabbing{cursor:grabbing}
  #sky.point{cursor:pointer}

  /* ---------- 排印为星：左上 XYZ 大字 ---------- */
  #hud{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;flex-wrap:wrap;
    align-items:flex-start;gap:14px;padding:22px 28px;pointer-events:none}
  #hud>*{pointer-events:auto}
  #brand{
    border:0;background:none;color:var(--bright);
    font-size:clamp(3rem,7vw,7.5rem);font-weight:700;line-height:1;
    letter-spacing:.22em;padding:0 0 0 .1em;
    opacity:.94;text-shadow:0 0 34px rgba(217,180,107,.16);
    transition:letter-spacing .3s ease,opacity .3s ease,text-shadow .3s ease;
  }
  #brand:hover{
    letter-spacing:.30em;
    text-shadow:0 0 46px rgba(217,180,107,.34);
  }

  /* ── 星际疗愈厅 · 心形徽章（token 映射至本页 5 色系统：心=朱砂） ── */
  #heart-badge{
    display:inline-flex;align-items:center;gap:7px;text-decoration:none;
    min-height:42px;margin-top:6px;padding:0 15px 0 11px;border-radius:999px;
    border:1.5px solid rgba(242,237,223,.30);background:rgba(6,9,19,.44);
    color:var(--bright);font-size:13px;letter-spacing:.1em;white-space:nowrap;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    transition:color .3s,border-color .3s,box-shadow .3s;
  }
  body.day #heart-badge{background:rgba(250,246,236,.6);border-color:rgba(34,29,20,.3);color:var(--ink)}
  #heart-badge svg{width:14px;height:14px;display:block;fill:var(--cinnabar);
    filter:drop-shadow(0 0 4px rgba(200,69,43,.45))}
  #heart-badge b{
    font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold);
    min-width:1.1em;text-align:center;
  }
  #heart-badge:hover{color:var(--gold);border-color:var(--gold);box-shadow:0 0 14px rgba(217,180,107,.25)}
  #heart-badge.err b{display:none}  /* 计数不可达：只留心，不显示错误 */

  #hud .sp{flex:1 0 4px;pointer-events:none}
  .hbtn{
    min-width:42px;height:42px;border-radius:999px;padding:0 15px;
    border:1.5px solid rgba(242,237,223,.30);background:rgba(6,9,19,.44);
    color:var(--bright);font-size:13px;letter-spacing:.1em;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    transition:border-color .3s,color .3s,background .3s;
  }
  body.day .hbtn{background:rgba(250,246,236,.6);border-color:rgba(34,29,20,.3)}
  .hbtn:hover{border-color:var(--gold);color:var(--gold)}
  .hbtn.speaking{color:var(--ink)!important;background:var(--gold)!important;border-color:var(--gold)!important}
  #hud .btns{display:flex;gap:9px}

  /* ---------- 底部铭文 ---------- */
  #motto{
    position:fixed;left:0;right:0;bottom:8.5vh;z-index:5;text-align:center;
    pointer-events:none;color:var(--bright);opacity:.82;
    font-size:clamp(1.05rem,2.3vw,2rem);font-weight:400;
    letter-spacing:.42em;text-indent:.42em;
    text-shadow:0 2px 24px rgba(6,9,19,.6);
    animation:mottoIn 1.9s cubic-bezier(.2,.7,.3,1) .35s both;
    transition:letter-spacing .45s ease,opacity .45s ease;
  }
  #motto:hover{letter-spacing:.5em}
  @keyframes mottoIn{from{opacity:0;transform:translateY(14px);letter-spacing:.2em}to{opacity:.82;transform:none}}
  body.day #motto{text-shadow:0 2px 20px rgba(250,246,236,.7)}

  /* ---------- 三体注脚（诚实律） ---------- */
  #credo{
    position:fixed;left:0;right:0;bottom:1.1vh;z-index:5;
    display:flex;justify-content:center;align-items:center;gap:12px;
    flex-wrap:wrap;padding:0 10px;pointer-events:none;
  }
  #credo-note{
    font-size:10.5px;letter-spacing:.05em;opacity:.5;color:var(--bright);
    text-align:center;max-width:72vw;
  }
  body.day #credo-note{color:var(--ink)}

  /* ---------- 节点花瓣面板（点击绽放成花） ---------- */
  #panel,#lawcard{
    position:fixed;z-index:70;width:300px;
    background:rgba(9,13,24,.90);border:1px solid rgba(217,180,107,.5);
    border-radius:26px 30px 24px 28px;
    box-shadow:0 0 0 1px rgba(217,180,107,.12),0 24px 60px rgba(0,0,0,.55),0 0 80px rgba(217,180,107,.16);
    padding:19px 22px 16px;color:var(--bright);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  body.day #panel,body.day #lawcard{
    background:rgba(250,246,236,.93);color:var(--ink);
    box-shadow:0 0 0 1px rgba(142,105,31,.16),0 24px 60px rgba(64,50,24,.22),0 0 80px rgba(142,105,31,.12);
  }
  #panel[hidden],#lawcard[hidden]{display:none}
  #panel.bloom{animation:bloom .42s cubic-bezier(.22,.86,.32,1.06) both}
  @keyframes bloom{
    0%{transform:scale(.1) rotate(-7deg);opacity:0;filter:blur(6px)}
    100%{transform:scale(1) rotate(0deg);opacity:1;filter:blur(0)}
  }
  .pclose{
    position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;
    border:1px solid rgba(242,237,223,.3);background:none;color:inherit;opacity:.75;font-size:13px;line-height:1;
  }
  .pclose:hover{background:var(--cinnabar);border-color:var(--cinnabar);color:var(--bright);opacity:1}
  .ptag{
    display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.16em;
    color:var(--gold);border:1px solid var(--gold);border-radius:999px;
    padding:2px 11px;margin-bottom:9px;
  }
  #panel h3,#lawcard h3{margin:0 0 6px;font-size:17.5px;letter-spacing:.03em;color:inherit;padding-right:22px}
  .pnote{margin:0;font-size:12.5px;color:inherit;opacity:.72;line-height:1.75}
  .pdetail{margin:9px 0 0;font-size:11.5px;opacity:.66;line-height:1.8;
    border-top:1px dashed rgba(217,180,107,.35);padding-top:8px}
  .pdetail b{opacity:.9;font-weight:700}
  .prow{display:flex;align-items:center;gap:9px;margin-top:12px;flex-wrap:wrap}
  .pgo{
    display:inline-block;min-height:37px;line-height:37px;padding:0 20px;border-radius:999px;
    background:var(--gold);color:#0C0A07;text-decoration:none;font-size:13.5px;font-weight:700;letter-spacing:.05em;
    box-shadow:0 6px 22px rgba(217,180,107,.28);transition:box-shadow .3s,filter .3s;
  }
  .pgo:hover{filter:brightness(1.07);box-shadow:0 8px 30px rgba(217,180,107,.44)}
  .pgo.ghost{background:none;border:1.5px dashed rgba(217,180,107,.6);color:inherit;box-shadow:none}
  .pst{font-size:10.5px;opacity:.65;letter-spacing:.08em}
  .pst.on{color:var(--gold);opacity:1;font-weight:700}
  .pst.future{opacity:.65;border:1px dashed rgba(217,180,107,.5);border-radius:999px;padding:1px 8px}

  /* 定律卡（三条已证定律=苹果面上的金弦） */
  #lawcard{width:308px;top:50%;right:20px;transform:translateY(-50%)}
  .llaw{margin:2px 0 10px;font-size:14px;line-height:1.85;color:inherit}
  .lev{display:flex;gap:8px;align-items:flex-start;font-size:12px;opacity:.75;line-height:1.7;margin:7px 0}
  .lev b{
    flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--gold);opacity:1;
    border:1px solid var(--gold);border-radius:999px;padding:1px 8px;margin-top:2px;letter-spacing:.06em;
  }
  #law-jump{border:1.5px solid var(--gold);background:none;color:var(--gold);
    border-radius:999px;min-height:37px;padding:0 17px;font-size:13px;font-weight:700;transition:background .3s,color .3s}
  #law-jump:hover{background:var(--gold);color:#0C0A07}

  /* ---------- 一切之门（G 键展开·放射式完整索引） ---------- */
  #gate{
    position:fixed;inset:0;z-index:80;overflow:auto;
    background:radial-gradient(1100px 800px at 50% 46%, rgba(24,30,52,.86), rgba(6,9,19,.96) 70%);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    opacity:0;transition:opacity .5s ease;
  }
  body.day #gate{background:radial-gradient(1100px 800px at 50% 46%, rgba(250,246,236,.9), rgba(234,226,205,.97) 70%)}
  #gate[hidden]{display:none}
  #gate.on{opacity:1}
  #gate-title{
    text-align:center;padding:4.2vh 20px 0;color:var(--bright);
  }
  body.day #gate-title{color:var(--ink)}
  #gate-title h2{
    margin:0;font-size:clamp(1.5rem,3.4vw,2.6rem);font-weight:700;
    letter-spacing:.6em;text-indent:.6em;
  }
  #gate-title p{margin:8px 0 0;font-size:12px;opacity:.6;letter-spacing:.24em}
  #gate-field{position:relative;min-height:76vh}
  /* 中心喉咙徽记（喉=门） */
  .gcore{
    position:absolute;left:50%;top:46%;width:112px;height:112px;margin:-56px 0 0 -56px;
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,#000 0 40%,rgba(0,0,0,.92) 58%,rgba(0,0,0,0) 74%);
    box-shadow:0 0 0 1.5px rgba(217,180,107,.75),0 0 34px 6px rgba(217,180,107,.28),inset 0 0 26px rgba(0,0,0,.9);
  }
  body.day .gcore{box-shadow:0 0 0 1.5px rgba(142,105,31,.75),0 0 34px 6px rgba(142,105,31,.2),inset 0 0 26px rgba(0,0,0,.9)}
  .gcore::before{
    content:'';position:absolute;inset:-20px;border-radius:50%;
    background:conic-gradient(from 0deg,transparent 0 34%,rgba(217,180,107,.85) 45%,transparent 56% 64%,rgba(217,180,107,.45) 74%,transparent 84% 100%);
    -webkit-mask:radial-gradient(circle,transparent 57%,#000 60%,#000 78%,transparent 81%);
    mask:radial-gradient(circle,transparent 57%,#000 60%,#000 78%,transparent 81%);
    animation:gsnip 20s linear infinite;opacity:.6;
  }
  @keyframes gsnip{to{transform:rotate(360deg)}}
  /* 12 环玫瑰卡：φ 网格半径 --dx/--dy 由 JS 注入 */
  .gcard{
    position:absolute;left:50%;top:46%;width:178px;max-width:30vw;
    transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px))) scale(.05);
    opacity:0;
    transition:transform .66s cubic-bezier(.17,.84,.3,1.03) var(--d,0ms),opacity .5s ease var(--d,0ms);
    border:1px solid rgba(217,180,107,.28);border-radius:14px;
    background:rgba(10,14,26,.72);padding:10px 12px 9px;color:var(--bright);
  }
  body.day .gcard{background:rgba(250,246,236,.78);color:var(--ink);border-color:rgba(142,105,31,.3)}
  #gate.on .gcard{transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px))) scale(1);opacity:1}
  .ghead{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:5px;
    border-bottom:1px solid rgba(217,180,107,.3);padding-bottom:5px}
  .gring{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.2em}
  .gsize{font-size:9.5px;opacity:.55}
  .gnd{
    display:flex;align-items:center;gap:7px;width:100%;text-align:left;
    border:0;background:none;color:inherit;font-size:12px;line-height:1.5;
    padding:3.5px 4px;border-radius:7px;transition:background .25s,color .25s;
  }
  .gnd i{flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 7px rgba(217,180,107,.8)}
  .gnd:hover{background:rgba(217,180,107,.16);color:var(--gold)}
  .gnd.past{opacity:.62}.gnd.past i{background:rgba(242,237,223,.5);box-shadow:none}
  .gnd.future{opacity:.55}.gnd.future i{background:none;border:1px dashed var(--gold);box-shadow:none}
  #gate-close{
    position:fixed;top:20px;right:22px;z-index:82;width:40px;height:40px;border-radius:50%;
    border:1.5px solid rgba(217,180,107,.6);background:rgba(6,9,19,.5);color:var(--gold);font-size:15px;
    backdrop-filter:blur(6px);
  }
  body.day #gate-close{background:rgba(250,246,236,.7)}
  #gate-close:hover{background:var(--gold);color:#0C0A07}
  /* 小屏：门退化为纵列滚动（可用优先） */
  #gate.small #gate-field{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 14px 60px}
  #gate.small .gcore{display:none}
  #gate.small .gcard{position:static;transform:none;width:min(92vw,420px);max-width:none}

  /* ---------- 莫比乌斯翻面转场闪光层（800ms） ---------- */
  #warp{
    position:fixed;inset:0;z-index:85;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 50%,
      rgba(255,251,238,.98) 0%,rgba(233,204,138,.9) 18%,
      rgba(217,180,107,.55) 30%,transparent 58%);
    mix-blend-mode:screen;
  }
  body.day #warp{mix-blend-mode:normal}

  /* ---------- 提示 / toast ---------- */
  #hint{
    position:fixed;left:50%;bottom:4.2vh;transform:translateX(-50%);z-index:50;
    font-size:11.5px;letter-spacing:.14em;color:var(--bright);opacity:.62;white-space:nowrap;
    background:rgba(6,9,19,.4);border:1px solid rgba(217,180,107,.22);border-radius:999px;
    padding:5px 17px;transition:opacity .8s;pointer-events:none;
  }
  body.day #hint{background:rgba(250,246,236,.55)}
  #hint.off{opacity:0}
  #toast{
    position:fixed;left:50%;bottom:14vh;transform:translateX(-50%) translateY(8px);z-index:90;
    background:rgba(9,13,24,.94);border:1.5px solid var(--gold);border-radius:12px;color:var(--bright);
    font-size:13px;font-weight:700;padding:9px 18px;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;max-width:86vw;text-align:center;
    box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 44px rgba(217,180,107,.2);
  }
  body.day #toast{background:rgba(250,246,236,.96);color:var(--ink)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- 键盘可达的隐形入口清单 ---------- */
  .sr-only{
    position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;
    clip:rect(0 0 0 0);clip-path:inset(50%);overflow:hidden;white-space:nowrap;
  }
  .sr-only a:focus{position:fixed;top:64px;left:12px;width:auto;height:auto;
    clip:auto;clip-path:none;background:rgba(9,13,24,.95);border:1.5px solid var(--gold);
    border-radius:10px;padding:8px 14px;z-index:99;margin:0;overflow:visible;color:var(--bright)}

  noscript .ns{
    position:fixed;inset:0;z-index:99;overflow:auto;background:var(--deep);color:var(--bright);
    padding:70px 24px;text-align:center;font-size:15px;line-height:2.1;
  }
  noscript .ns a{font-size:17px}

  @media (max-width:640px){
    #hud{padding:16px 16px}
    #panel{width:222px}
    #lawcard{width:248px;right:10px}
    #motto{bottom:10vh;letter-spacing:.3em}
    #credo-note{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    #motto{animation:none;opacity:.82}
    #panel.bloom{animation:none}
    .gcore::before{animation:none}
    #gate.on .gcard{transition:opacity .3s}
    #hint,#toast{transition:none}
  }
</style>
</head>

/* 12 尺度刻度：throat=尺度 0 起点（s=0·即 ψ=0）·s=i/12
   i<6 落在黑洞侧（ψ∈[0,π)·h≥0）·i≥6 落在白洞侧（ψ∈[π,2π)·h≤0） */
function tickS(i){ return i / 12; }

/* —— 节点挂管：同尺度多节点沿螺线小步错开（方位角自动散开） —— */
function assignSlots(nodes){
  var groups = {};
  nodes.forEach(function(nd){
    (groups[nd.scale] = groups[nd.scale] || []).push(nd);
  });
  Object.keys(groups).forEach(function(k){
    var g = groups[k], n = g.length;
    var d = n > 1 ? Math.min(0.0035, 0.028 / (n - 1)) : 0;
    g.forEach(function(nd, j){
      var s = nd.scale / 12 + (n > 1 ? (j - (n - 1) / 2) * d : 0);
      nd._s = Math.min(0.996, Math.max(0.004, s));
      nd._psi = spiralPsi(nd._s);
      nd._th = spiralTheta(nd._s);
      nd._lab = (j % 2) * 12 - 6;
    });
  });
}
function nodePos(nd){
  var p = loopPoint(nd._psi), nr = loopOutN(nd._psi), th = nd._th, off = 5.5;
  var r = p[0] + nr[0] * off, h = p[1] + nr[1] * off;
  return [r * Math.cos(th), h, r * Math.sin(th)];
}

/* —— 金弦（已证定律）：两端锚定刻度·沿苹果面爬过腹部 —— */
function wrapA(d){
  while(d > Math.PI) d -= TAU;
  while(d < -Math.PI) d += TAU;
  return d;
}
function buildChord(wh){
  var sf = wh.from / 12, st = wh.to / 12;
  var dth = wrapA(spiralTheta(st) - spiralTheta(sf));
  wh._pts = [];
  for(var k = 0; k <= 40; k++){
    var u = k / 40;
    var psi = TAU * (sf + (st - sf) * u);
    var th = spiralTheta(sf) + dth * u;
    var p = loopPoint(psi), nr = loopOutN(psi);
    var r = p[0] + nr[0] * 3.5, h = p[1] + nr[1] * 3.5;
    wh._pts.push([r * Math.cos(th), h, r * Math.sin(th)]);
  }
}

/* ==========================================================
   ③ 闭环粒子流（单池四相·真正的循环·非两股对流）
   fall：上叶外远处→沿漏斗壁螺旋坠入（q² 加速·近喉最亮）
   ride：过喉→入螺线管沿苹果绕行（随莫比乌斯标架翻面·经停节点）
   exit：下叶漏斗沿壁喷出（减速·张开发散）
   drift：外部飘散淡去→再被上叶捕获（回 fall）
   ========================================================== */
var PH_DUR = [11, 27, 8, 6.5];   /* 四相基准时长（秒） */
function fallPos(p, q){
  var e = q * q;
  var r = RFAR * Math.exp(Math.log(R0 / RFAR) * e);
  var lam = p.l0 + 2.6 * Math.log(RFAR / r);
  var h = hUp(r) + 2.2;
  return [r * Math.cos(lam), h, r * Math.sin(lam), 0.35 + 0.65 * Math.pow(q, 1.7)];
}
function ridePos(p, q){
  var C = spiralC(q), n = frameN(q);
  var jr = p.jr * TUBE_W * 0.8 * Math.cos(p.ja);
  return [C[0] + n[0] * jr, C[1] + n[1] * jr, C[2] + n[2] * jr,
          0.5 + 0.5 * (0.5 + 0.5 * Math.cos(TAU * q))];
}
function exitPos(p, q){
  var e = 1 - (1 - q) * (1 - q);
  var r = R0 * Math.exp(Math.log(REX / R0) * e);
  var lam = p.l0 + p.spread * q * q * 2.2;
  var h = hLo(r) * (1 + 0.06 * q) - 1.2;
  return [r * Math.cos(lam), h, r * Math.sin(lam), 0.1 + 0.85 * (1 - q)];
}
function driftPos(p, q){
  var e0 = exitPos(p, 1);
  return [e0[0] + p.driftV[0] * q * 46 + Math.cos(q * 6 + p.ja) * 2,
          e0[1] + p.driftV[1] * q * 30,
          e0[2] + p.driftV[2] * q * 46,
          0.3 * (1 - q)];
}
function flowPos(p){
  if(p.ph === 0) return fallPos(p, p.t);
  if(p.ph === 1) return ridePos(p, p.t);
  if(p.ph === 2) return exitPos(p, p.t);
  return driftPos(p, p.t);
}
function nextPhase(p){
  p.ph = (p.ph + 1) % 4;
  p.t = 0;
  p.dur = PH_DUR[p.ph] * (0.8 + 0.4 * p.rnd());
  if(p.ph === 0) p.l0 = p.l0 + 1.7 + p.rnd() * 2;                      /* 再捕获：新坠落方位 */
  if(p.ph === 2) p.l0 = spiralTheta(1) + (p.rnd() - 0.5) * 0.5;        /* 喷出方位续接管尾 */
}
function stepParticle(p, dt){
  p.t += dt / p.dur;
  var guard = 0;
  while(p.t >= 1 && guard++ < 8){ p.t -= 1; nextPhase(p); }
}

var FLOW = [];
(function(){
  var i;
  for(i = 0; i < FLOW_N; i++){
    var rnd = mulberry32(20260822 + i * 97);
    var ph = i % 4;
    FLOW.push({
      ph: ph, t: rnd(), dur: PH_DUR[ph] * (0.8 + 0.4 * rnd()),
      l0: rnd() * TAU, ja: rnd() * TAU, jr: rnd() * 0.85,
      spread: (rnd() * 2 - 1) * 0.85,
      driftV: [rnd() * 2 - 1, -0.2 - rnd() * 0.5, rnd() * 2 - 1],
      sz: 0.7 + rnd() * 1.7, al: 0.3 + rnd() * 0.55,
      rnd: rnd
    });

})();

/* ---------- 相机（轨道旋转+莫比乌斯翻面·纯函数） ---------- */
var FF = 650;
function makeCam(){ return {yaw: -0.55, pitch: 0.5, mu: 0, zoom: 1, cen: [0, 0, 0]}; }
function camRot(p, cam){
  var x = p[0] - cam.cen[0], y = p[1] - cam.cen[1], z = p[2] - cam.cen[2];
  var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  var x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
  var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  var y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
  var cm = Math.cos(cam.mu), sm = Math.sin(cam.mu);
  return [x1, y2 * cm - z2 * sm, y2 * sm + z2 * cm];
}
function camProject(p, cam, vw, vh){
  var q = camRot(p, cam);
  var pers = FF / (FF - q[2]);
  return [vw / 2 + cam.zoom * q[0] * pers, vh / 2 - cam.zoom * q[1] * pers, q[2]];
}
function clampZoom(fit, z){
  return Math.max(fit * 0.5, Math.min(fit * 14, z));
}
function muFlip(m){ return (((m + Math.PI) % TAU) + TAU) % TAU; }

/* φ 网格：一切之门的环半径 = base·φ^(s/6) */
var GATE_BASE = 0.155;
function gateR(s){ return GATE_BASE * Math.pow(PHI, s / 6); }

  /* 10. 数据保全（沿用旧版素材）+ 诚实律 + 隐私 */
  ok(PATTERNS.length === 6, 'six patterns');
  ok(HUBS.reduce(function(s,h){ return s + h.n; }, 0) === 152, 'leaves sum 152');
  ok(TTS_GUIDE.length > 60 && TTS_GUIDE.length < 400, 'tts guide length ' + TTS_GUIDE.length);

  console.log((fails === 0 ? 'ALL PASS' : 'FAILED') + ': ' + (n - fails) + '/' + n + ' checks');

/* —— 通用折线绘制：按前后景分段换透明度（教科书线框深度感） —— */
function strokeRuns2(pts, color, aNear, aFar, width){
  var curNear = null, buf = [];
  function flush(){
    if(buf.length > 1){
      ctx.beginPath();
      ctx.moveTo(buf[0][0], buf[0][1]);
      for(var q = 1; q < buf.length; q++) ctx.lineTo(buf[q][0], buf[q][1]);
      ctx.lineWidth = width;
      ctx.strokeStyle = color;
      ctx.globalAlpha = curNear ? aNear : aFar;
      ctx.stroke();
    }
    buf = [];
  }
  for(var k = 0; k < pts.length; k++){
    var near = pts[k][2] >= 0;
    if(curNear === null) curNear = near;
    if(near !== curNear){ flush(); curNear = near; }
    buf.push(pts[k]);
  }
  flush();
  ctx.globalAlpha = 1;
}

/* 圆环（等高线·纬线） */
function ringPts(r, h, seg){
  var pts = [];
  for(var k = 0; k <= seg; k++){
    var a = k / seg * TAU;
    pts.push(proj([r * Math.cos(a), h, r * Math.sin(a)]));
  }
  return pts;
}

  }
  /* 上叶经线：8 条·极淡（引导坠入） */
  for(i = 0; i < 8; i++){

/* —— 环面黄金螺线管（莫比乌斯带·两圈归位） —— */
function drawSpiral(P){
  var night = P.night;
  var i;
  /* 带边 A/B（各画两圈：A(2)=A(0) 才闭合——莫比乌斯可视） */
  for(var signI = 0; signI < 2; signI++){
    var sign = signI === 0 ? 1 : -1;
    for(var half = 0; half < 4; half++){
      var pts = [];
      for(var k = 0; k <= 260; k++){
        var s = (half * 0.5 + k / 260 * 0.5);
        pts.push(proj(edgePt(s, sign)));
      }
      var upper = (half % 2) === 0;   /* s∈[0,.5)∪[1,1.5)=黑洞侧 */
      strokeRuns2(pts, P.gold,
                  upper ? 0.82 : 0.46,
                  upper ? 0.30 : 0.15, 1.5);
    }
  }
  /* 中心线（一圈闭合） */
  for(i = 0; i < 2; i++){
    var pts2 = [];
    for(var k2 = 0; k2 <= 300; k2++){
      var s2 = i * 0.5 + k2 / 300 * 0.5;
      pts2.push(proj(spiralC(s2)));

  /* 12 尺度刻度（外侧 6·内侧 6·喉=尺度 0） */
  for(i = 0; i < 12; i++){

    var C = spiralC(s3), n3 = frameN(s3);
    var A = proj([C[0] - 5.5 * n3[0], C[1] - 5.5 * n3[1], C[2] - 5.5 * n3[2]]);
    var B = proj([C[0] + 5.5 * n3[0], C[1] + 5.5 * n3[1], C[2] + 5.5 * n3[2]]);

    ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]);
    ctx.lineWidth = i === 5 ? 2.2 : 1.6;
    ctx.strokeStyle = i === 5 ? P.gold : P.bright;
    ctx.globalAlpha = 0.5 + 0.4 * (i === 5 ? 1 : 0.5);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

    var fade = 1;
    if(p.ph === 0) fade = Math.min(1, p.t / 0.06);
    if(p.ph === 3) fade = 1;
    var scr = proj([pos[0], pos[1], pos[2]]);
    if(scr[0] < -10 || scr[0] > VW + 10 || scr[1] < -10 || scr[1] > VH + 10) continue;
    var depthK = scr[2] >= 0 ? 1 : 0.55;
    var sz = p.sz * clamp(cam.zoom * 0.8, 0.8, 3.4);
    ctx.globalAlpha = clamp(p.al * pos[3] * fade * depthK * (night ? 1 : 0.55), 0, 1);
    ctx.drawImage(sp.gold, scr[0] - sz, scr[1] - sz, sz * 2, sz * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

/* 节点被经过时发亮（ride 相粒子扫过管上节点） */
function updateVisits(){
  NODES.forEach(function(nd){ nd._v = (nd._v || 0) * 0.965; });
  if(REDUCE) return;
  for(var i = 0; i < FLOW_N; i++){
    var p = FLOW[i];
    if(p.ph !== 1) continue;
    for(var j = 0; j < NODES.length; j++){
      var nd = NODES[j];
      var d = Math.abs(p.t - nd._s);
      d = Math.min(d, 1 - d);
      if(d < 0.02 && nd._v < 1 - d / 0.02) nd._v = 1 - d / 0.02;
    }
  }
}

/* 版本链细枝（谱系=文明尺度的珠串·沿管） */
function drawChain(P){
  var chain = NODES.filter(function(nd){ return nd.chain != null; }).sort(function(a,b){ return a.chain - b.chain; });
  if(chain.length < 2) return;
  ctx.beginPath();
  var started = false;
  chain.forEach(function(nd){
    var p = proj(nd._p3);
    if(started) ctx.lineTo(p[0], p[1]); else { ctx.moveTo(p[0], p[1]); started = true; }
  });
  ctx.strokeStyle = P.bright; ctx.globalAlpha = 0.32; ctx.lineWidth = 1;
  ctx.setLineDash([2, 5]); ctx.stroke(); ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

/* 节点微缩装饰（沿用） */
function drawDeco(P, nd, p, t){
  var night = P.night, i;
  if(nd.deco === 'glow'){
    var g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], 84);
    g.addColorStop(0, P.gold);
    g.addColorStop(0.4, 'rgba(217,180,107,.4)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = night ? 0.5 : 0.3;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p[0], p[1], 84, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }else if(nd.deco === 'neural'){
    var soma = [], k;
    for(k = 0; k < 6; k++){
      var a = k * GA + (REDUCE ? 0 : t / 9000);
      soma.push([p[0] + Math.cos(a) * 24, p[1] + Math.sin(a) * 24]);
    }
    ctx.strokeStyle = P.bright; ctx.globalAlpha = 0.4; ctx.lineWidth = 1;
    ctx.beginPath();
    for(k = 0; k < 6; k++){
      ctx.moveTo(p[0], p[1]); ctx.lineTo(soma[k][0], soma[k][1]);
      ctx.moveTo(soma[k][0], soma[k][1]); ctx.lineTo(soma[(k + 1) % 6][0], soma[(k + 1) % 6][1]);
    }
    ctx.stroke();
    for(k = 0; k < 6; k++){
      var tw = REDUCE ? 0.6 : 0.4 + 0.6 * Math.sin(t / 700 + k * 1.7);
      ctx.globalAlpha = 0.35 + 0.55 * tw;
      ctx.beginPath(); ctx.arc(soma[k][0], soma[k][1], 2.4, 0, TAU);
      ctx.fillStyle = k % 3 === 0 ? P.gold : P.bright;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }else if(nd.deco === 'hex'){
    for(i = 0; i < 6; i++){
      var a2 = i * TAU / 6 + (REDUCE ? 0 : t / 14000);
      ctx.beginPath();
      ctx.arc(p[0] + Math.cos(a2) * 15, p[1] + Math.sin(a2) * 15, 2, 0, TAU);
      ctx.fillStyle = P.gold; ctx.globalAlpha = 0.75;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(p[0], p[1], 15, 0, TAU);
    ctx.strokeStyle = P.gold; ctx.globalAlpha = 0.3; ctx.lineWidth = 1; ctx.setLineDash([2, 4]);
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }else if(nd.deco === 'seeds'){
    var hubs = [];
    for(i = 0; i < 3; i++){
      var a3 = -Math.PI / 2 + i * TAU / 3;
      hubs.push([p[0] + Math.cos(a3) * 14, p[1] + Math.sin(a3) * 14]);
    }
    ctx.strokeStyle = P.bright; ctx.globalAlpha = 0.35; ctx.lineWidth = 1;
    ctx.beginPath();
    hubs.forEach(function(h, k){ k === 0 ? ctx.moveTo(h[0], h[1]) : ctx.lineTo(h[0], h[1]); });
    ctx.closePath(); ctx.stroke();
    var rnd = mulberry32(152);
    for(i = 0; i < 14; i++){
      var a4 = rnd() * TAU, r4 = 18 + rnd() * 12;
      ctx.beginPath();
      ctx.arc(p[0] + Math.cos(a4) * r4, p[1] + Math.sin(a4) * r4, 1.1, 0, TAU);
      ctx.fillStyle = P.gold; ctx.globalAlpha = 0.7; ctx.fill();
    }
    hubs.forEach(function(h){
      ctx.beginPath(); ctx.arc(h[0], h[1], 3, 0, TAU);
      ctx.fillStyle = P.gold; ctx.globalAlpha = 0.9; ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
}

/* ---------- 节点=管上的活星（呼吸·悬停 300ms 吸亮·被粒子经过发亮） ---------- */
function tierOf(nd){
  if(nd.primary) return 0;
  if(nd.status === 'active') return 1;
  if(nd.status === 'past') return 2;
  return 3;
}
function drawNodes(P, t){
  var sp = sprites();
  NODES.forEach(function(nd){
    var scr = proj(nd._p3);
    nd._sx = scr[0]; nd._sy = scr[1]; nd._depth = scr[2];
    if(scr[0] < -140 || scr[0] > VW + 140 || scr[1] < -140 || scr[1] > VH + 140){ nd._h = 0; return; }
    var hov = HOVER && HOVER.type === 'node' && HOVER.nd === nd;
    var sel = PANEL_ND === nd;
    var tgtH = (hov || sel) ? 1 : 0;
    nd._h = (nd._h || 0) + (tgtH - (nd._h || 0)) * (REDUCE ? 1 : 0.14);
    var h = nd._h;
    var v = nd._v || 0;
    drawDeco(P, nd, scr, t);
    var br = REDUCE ? 0 : Math.sin(t / 1000 * 1.1 + nd._s * 40);
    var base = nd.primary ? 8 : (nd.kid ? 4.6 : (nd.status === 'future' ? 4 : 6));
    var r = base * (1 + 0.06 * br) * (1 + 0.55 * h + 0.3 * v);
    var op = (nd.op || 1) * (0.82 + 0.12 * br + 0.18 * v);
    if(h > 0.03 || v > 0.03){
      ctx.globalAlpha = clamp(0.5 * h + 0.45 * v, 0, 1);
      ctx.drawImage(sp.gold, scr[0] - r * 3.4, scr[1] - r * 3.4, r * 6.8, r * 6.8);
      ctx.globalAlpha = 1;
    }
    if(nd.status === 'future'){
      ctx.beginPath(); ctx.arc(scr[0], scr[1], r, 0, TAU);
      ctx.setLineDash([2.5, 2.5]);
      ctx.strokeStyle = h > 0.3 ? P.gold : P.bright;
      ctx.lineWidth = 1.5; ctx.globalAlpha = 0.9 * op;
      ctx.stroke(); ctx.setLineDash([]);
    }else{
      if(nd.primary || h > 0.25 || v > 0.2){
        ctx.globalAlpha = clamp((nd.primary ? 0.8 : 0.6 * Math.max(h, v)) * op, 0, 1);
        ctx.drawImage(sp.gold, scr[0] - r * 2.6, scr[1] - r * 2.6, r * 5.2, r * 5.2);
      }
      ctx.beginPath(); ctx.arc(scr[0], scr[1], r, 0, TAU);
      ctx.fillStyle = nd.status === 'active' ? P.gold : (P.night ? 'rgba(10,14,26,.9)' : 'rgba(250,246,236,.9)');
      ctx.strokeStyle = nd.status === 'active' ? P.gold : P.bright;
      ctx.lineWidth = 1.8; ctx.globalAlpha = op;
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(scr[0], scr[1], r * 0.32, 0, TAU);
      ctx.fillStyle = P.night ? P.deep : P.bright;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    /* 标签 */
    var a = [1, 0.92, 0.8, 0.74][tierOf(nd)];
    if(nd._depth < 0) a *= 0.5;
    if(h > 0.05) a = Math.max(a, h);
    if(a < 0.06) return;
    var fs = nd.primary ? 13.5 : (nd.kid ? 11 : 12);
    ctx.font = (nd.primary ? '700 ' : '600 ') + fs + 'px ' + SERIF;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = a;
    ctx.strokeStyle = P.night ? P.deep : P.bright; ctx.lineWidth = 3.2;
    ctx.strokeText(nd.name, scr[0] + r + 7, scr[1] + (nd._lab || 0));
    ctx.fillStyle = (nd.primary || hov || sel) ? P.gold : (P.night ? P.bright : P.ink);
    ctx.fillText(nd.name, scr[0] + r + 7, scr[1] + (nd._lab || 0));
    ctx.globalAlpha = 1;
  });
}

/* 你在这 · 人尺度（刻度 5·黑洞侧腹部）· 1Hz 呼吸 */
function drawYouMarker(P, t){
  var p = proj(spiralC(tickS(5)));
  if(p[0] < -60 || p[0] > VW + 60 || p[1] < -60 || p[1] > VH + 60) return;
  var br = REDUCE ? 0 : Math.sin(t / 1000 * TAU);
  var sp = sprites();
  ctx.globalAlpha = 0.55 + 0.3 * br;
  ctx.drawImage(sp.gold, p[0] - 26, p[1] - 26, 52, 52);
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(p[0], p[1], 6 + 1.8 * br, 0, TAU);
  ctx.strokeStyle = P.gold; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(p[0], p[1], 10.5 - 1.2 * br, 0, TAU);
  ctx.strokeStyle = P.gold; ctx.lineWidth = 1; ctx.globalAlpha = 0.55; ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.font = '700 12.5px ' + SERIF;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = P.night ? P.deep : P.bright; ctx.lineWidth = 3;
  ctx.strokeText('你在这', p[0] + 15, p[1] - 14);
  ctx.fillStyle = P.gold;
  ctx.fillText('你在这', p[0] + 15, p[1] - 14);
}

function render(t){
  var P = pal();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  drawStars(P, t);
  drawAppleBloom(P);
  drawContours(P, t);
  drawChords(P);
  drawThroat(P, t, t / 1000);
  drawSpiral(P);
  drawTickLabels(P);
  drawChain(P);
  updateVisits();
  drawFlow(P, t);
  drawNodes(P, t);
  drawYouMarker(P, t);
  positionPanel();
}

/* ==========================================================
   交互
   ========================================================== */
var HOVER = null, PANEL_ND = null, LAW = null, FLY = null, FLIP = null;
var pointers = new Map();
var dragMoved = 0, dragT0 = 0, yawV = 0, pitchV = 0, lastMoveT = 0, inertiaOn = false;
var pinch0 = null;

function panelOpen(){ return PANEL_ND != null; }
function lawOpen(){ return LAW != null; }
function gateOpen(){ return !$('#gate').hidden; }
function busy(){ return !!FLIP; }

function hitNode(sx, sy){
  var best = null, bd = 1e9;
  NODES.forEach(function(nd){
    if(nd._sx === undefined) return;
    var base = nd.primary ? 8 : (nd.kid ? 4.6 : (nd.status === 'future' ? 4 : 6));
    var r = base * 1.3 + 9;
    var d = Math.hypot(nd._sx - sx, nd._sy - sy);
    if(d < r && d < bd){ bd = d; best = nd; }
  });
  return best;
}
function hitThroat(sx, sy){
  var c = proj([0, 0, 0]);
  var R = Math.max(24, R0 * cam.zoom * 1.1);
  return Math.hypot(c[0] - sx, c[1] - sy) <= R;
}
function hitChord(sx, sy){
  for(var i = 0; i < WORMHOLES.length; i++){
    var wh = WORMHOLES[i], best = 1e9;
    for(var k = 0; k < wh._pts.length; k += 2){
      var p = proj(wh._pts[k]);
      best = Math.min(best, Math.hypot(p[0] - sx, p[1] - sy));
    }
    if(best <= 12) return wh;
  }
  return null;
}
function hitLowerFunnel(sx, sy){
  var c = proj([0, -H_FLAT * 0.82, 0]);
  var R = Math.max(36, RBELLY * cam.zoom * 0.55);
  return Math.hypot(c[0] - sx, c[1] - sy) <= R;
}
function probe(sx, sy){
  var nd = hitNode(sx, sy);
  if(nd) return {type: 'node', nd: nd};
  if(hitThroat(sx, sy)) return {type: 'throat'};
  var wh = hitChord(sx, sy);
  if(wh) return {type: 'chord', wh: wh};
  if(hitLowerFunnel(sx, sy)) return {type: 'funnel'};
  return null;
}

cv.addEventListener('pointerdown', function(e){
  if(busy()) return;
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  dismissHint();
  if(pointers.size === 1){
    dragMoved = 0; dragT0 = performance.now();
    lastMoveT = dragT0; yawV = 0; pitchV = 0; inertiaOn = false;
    cv.classList.add('grabbing');
  }else if(pointers.size === 2){
    var ps = Array.from(pointers.values());
    pinch0 = {
      d: Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y),
      zoom: cam.zoom, pitch: cam.pitch
    };
  }
  FLY = null;
  needsDraw();
});

cv.addEventListener('pointermove', function(e){
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if(pointers.size === 1 && pointers.has(e.pointerId)){
    var prev = pointers.get(e.pointerId);
    var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    dragMoved += Math.hypot(dx, dy);
    cam.yaw += dx * 0.006;
    cam.pitch = clamp(cam.pitch + dy * 0.005, -1.25, 1.25);
    var now = performance.now(), dt = Math.max(1, now - lastMoveT);
    if(dt < 120){ yawV = dx * 0.006 / dt * 1000; pitchV = dy * 0.005 / dt * 1000; }
    lastMoveT = now;
    needsDraw();
  }else if(pointers.size === 2 && pinch0){
    var ps = Array.from(pointers.values());
    var d2 = Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
    cam.zoom = clampZoom(FIT, pinch0.zoom * (d2 / Math.max(20, pinch0.d)));
    dragMoved = 99;
    needsDraw();
  }else if(pointers.size === 0){
    var h = probe(e.clientX, e.clientY);
    if(!HOVER || !!h !== !!HOVER || (h && HOVER && (h.type !== HOVER.type || h.nd !== HOVER.nd || h.wh !== HOVER.wh))) needsDraw();
    HOVER = h;
    cv.classList.toggle('point', !!h);
  }
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinch0 = null;
  if(pointers.size === 0){
    cv.classList.remove('grabbing');
    var dt = performance.now() - dragT0;
    if(dragMoved < 7 && dt < 500){
      var h = probe(e.clientX, e.clientY);
      if(h && h.type === 'node') warpToNode(h.nd);
      else if(h && h.type === 'throat') startFlip();
      else if(h && h.type === 'chord') activate(h.wh);
      else if(h && h.type === 'funnel') ejectionView();
      else closeAll();
    }else if(!REDUCE && (Math.abs(yawV) > 0.15 || Math.abs(pitchV) > 0.1)){
      inertiaOn = true;
    }
  }
  needsDraw();
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', function(){ if(pointers.size === 0){ HOVER = null; cv.classList.remove('point'); needsDraw(); } });

cv.addEventListener('wheel', function(e){
  if(busy()) return;
  e.preventDefault();
  dismissHint();
  FLY = null;
  var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if(e.deltaMode === 1) d *= 16;
  cam.zoom = clampZoom(FIT, cam.zoom * Math.exp(-clamp(d, -240, 240) * 0.0016));
  needsDraw();
}, {passive: false});

window.addEventListener('keydown', function(e){
  var tag = e.target && e.target.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;
  if(tag === 'A' || tag === 'BUTTON'){
    if(e.key !== 'Escape') return;
  }
  if(e.key === 'Home' || e.key === 'h' || e.key === 'H'){ goHome(); e.preventDefault(); }
  else if(e.key === 'Escape'){ if(gateOpen()) closeGate(); else closeAll(); }
  else if(e.key === 'g' || e.key === 'G'){ if(!gateOpen()) openGate(); }
  else if(e.key === 'f' || e.key === 'F'){ if(!busy()) startFlip(); }
  else if(e.key === '+' || e.key === '='){ cam.zoom = clampZoom(FIT, cam.zoom * 1.25); needsDraw(); e.preventDefault(); }
  else if(e.key === '-' || e.key === '_'){ cam.zoom = clampZoom(FIT, cam.zoom / 1.25); needsDraw(); e.preventDefault(); }
  else if(e.key === 'ArrowLeft'){ cam.yaw -= 0.12; needsDraw(); e.preventDefault(); }
  else if(e.key === 'ArrowRight'){ cam.yaw += 0.12; needsDraw(); e.preventDefault(); }
  else if(e.key === 'ArrowUp'){ cam.pitch = clamp(cam.pitch + 0.1, -1.25, 1.25); needsDraw(); e.preventDefault(); }
  else if(e.key === 'ArrowDown'){ cam.pitch = clamp(cam.pitch - 0.1, -1.25, 1.25); needsDraw(); e.preventDefault(); }
});

/* ---------- 视角飞行 ---------- */
function flyTo(target, dur){
  var to = {
    yaw: target.yaw != null ? target.yaw : cam.yaw,
    pitch: target.pitch != null ? clamp(target.pitch, -1.25, 1.25) : cam.pitch,
    zoom: clampZoom(FIT, target.zoom != null ? target.zoom : cam.zoom),
    cen: target.cen || cam.cen
  };
  if(REDUCE){
    cam.yaw = to.yaw; cam.pitch = to.pitch; cam.zoom = to.zoom; cam.cen = to.cen;
    needsDraw(); return;
  }
  FLY = {t0: performance.now(), dur: dur || 950,
         from: {yaw: cam.yaw, pitch: cam.pitch, zoom: cam.zoom, cen: cam.cen},
         to: to, dYaw: wrapA(to.yaw - cam.yaw), dPitch: to.pitch - cam.pitch};
  needsDraw();
}
function stepFly(t){
  if(!FLY) return;
  var k = clamp((t - FLY.t0) / FLY.dur, 0, 1);
  var e = ease3(k);
  cam.yaw = FLY.from.yaw + FLY.dYaw * e;
  cam.pitch = FLY.from.pitch + FLY.dPitch * e;
  cam.zoom = lerp(FLY.from.zoom, FLY.to.zoom, e);
  cam.cen = [lerp(FLY.from.cen[0], FLY.to.cen[0], e),
             lerp(FLY.from.cen[1], FLY.to.cen[1], e),
             lerp(FLY.from.cen[2], FLY.to.cen[2], e)];
  if(k >= 1){ cam.zoom = FLY.to.zoom; FLY = null; }
}
function goHome(){ if(!gateOpen()) flyTo({yaw: YAW0, pitch: PITCH0, zoom: FIT, cen: [0, 0, 0]}, 850); }

/* ---------- 莫比乌斯翻面（800ms·沿轴 180°·内外互换） ---------- */
function startFlip(){
  closeAll();
  var warpEl = $('#warp');
  if(REDUCE){
    cam.mu = muFlip(cam.mu);
    warpEl.style.transition = 'opacity .18s ease';
    warpEl.style.opacity = '0.5';
    setTimeout(function(){ warpEl.style.opacity = '0'; }, 190);
    showToast('莫比乌斯翻面 · 内外侧互换——同一座桥，另一侧的你');
    needsDraw();
    return;
  }
  FLIP = {t0: performance.now(), from: cam.mu, to: cam.mu + Math.PI};
  warpEl.style.transition = 'none';
  needsDraw();
}
function stepFlip(t){
  if(!FLIP) return;
  var warpEl = $('#warp');
  var k = clamp((t - FLIP.t0) / WARP_MS, 0, 1);
  /* 前半加速旋入·后半减速绽开 */
  if(k < 0.5) cam.mu = FLIP.from + Math.PI * 0.5 * easeIn3(k / 0.5);
  else cam.mu = FLIP.from + Math.PI * (0.5 + 0.5 * easeOut3((k - 0.5) / 0.5));
  warpEl.style.opacity = (Math.sin(Math.PI * k) * 0.92).toFixed(3);
  if(k >= 1){
    cam.mu = muFlip(FLIP.from);
    warpEl.style.opacity = '0';
    FLIP = null;
    showToast('莫比乌斯翻面 · 内外侧互换——同一座桥，另一侧的你');
  }
  needsDraw();
}

/* ---------- 外送视图（点下漏斗·白洞喷发特写） ---------- */
function ejectionView(){
  if(cam.zoom > FIT * 3 && cam.pitch < -0.5){ goHome(); return; }
  flyTo({pitch: -1.02, zoom: FIT * 4.6, cen: [0, -40, 0]}, 1000);
  showToast('白洞 · 外送视图——产物从下方喷发（METAPHOR·见注脚）');
}

/* ---------- 穿越到节点（飞行+绽放面板） ---------- */
function warpToNode(nd){
  closeAll();
  var z = clamp(FIT * 5.2, FIT * 0.6, FIT * 14);
  flyTo({cen: [nd._p3[0] * 0.8, nd._p3[1] * 0.8, nd._p3[2] * 0.8], zoom: z}, 900);
  setTimeout(function(){ openPanel(nd, true); }, REDUCE ? 60 : 620);
}

/* ---------- 定律弦激活 ---------- */
function activate(wh){
  LAW = wh;
  $('#l-name').textContent = wh.name;
  $('#l-law').textContent = wh.law;
  [0, 1].forEach(function(i){
    var el = $('#l-ev' + i);
    el.innerHTML = '<b>' + wh.ev[i][0] + '</b><span>' + wh.ev[i][1] + '</span>';
  });
  $('#lawcard').hidden = false;
  needsDraw();
}
function jumpToFarEnd(wh){
  var A = wh._pts[0], B = wh._pts[40];
  var dA = Math.hypot(cam.cen[0] - A[0], cam.cen[1] - A[1]);
  var dB = Math.hypot(cam.cen[0] - B[0], cam.cen[1] - B[1]);
  var p = dA < dB ? B : A;
  flyTo({cen: [p[0] * 0.8, p[1] * 0.8, p[2] * 0.8], zoom: FIT * 5}, 950);
}
$('#law-jump').addEventListener('click', function(){ if(LAW) jumpToFarEnd(LAW); });
$('#l-close').addEventListener('click', function(){ LAW = null; $('#lawcard').hidden = true; needsDraw(); });

/* ---------- 节点花瓣面板 ---------- */
function ringLabel(nd){
  var s = nd.scale;
  var h = loopPoint(nd._psi)[1];
  var side = h >= 0 ? '黑洞侧' : '白洞侧';
  if(Math.abs(s - 4.6) < 0.011) return '虫洞管 · 人尺度内侧（孩子）';
  var f = Math.floor(s + 1e-9), c = Math.ceil(s - 1e-9);
  if(c !== f && Math.abs(s - f - 0.5) < 0.011) return '虫洞管 · ' + SCALES[f].name + '－' + SCALES[c].name + ' 环间 · ' + side;
  return '虫洞管 · ' + SCALES[Math.round(s)].name + '尺度 · ' + side;
}
function openPanel(nd, bloom){
  PANEL_ND = nd;
  LAW = null; $('#lawcard').hidden = true;
  $('#p-ring').textContent = ringLabel(nd);
  $('#p-name').textContent = nd.name;
  $('#p-note').textContent = nd.note;
  var det = $('#p-detail'), html = '';
  if(nd.id === 'disease-atlas'){
    html = '<b>六大跨系统模式</b><br>' + PATTERNS.map(function(p){ return p.name + '＝' + p.metaphor; }).join(' · ');
  }else if(nd.id === 'med-seed-net'){
    html = '<b>三种子</b><br>' + HUBS.map(function(h){ return h.name + '（' + h.n + ' 系）'; }).join(' · ') + '<br>共 152 医系';
  }else if(nd.id === 'final-unity'){
    html = '螺线收口处一道柔光——读完一切卷章之后的合一（管在此合拢回喉）。';
  }else if(nd.id === 'companion'){
    html = '问它，最小尺度的网络就亮一次——伴读从序言开始。';
  }else if(nd.id === 'healing-hall' || nd.id === 'love-net'){
    html = '白洞一侧的产物——「放」的具象：每一次真实的打开都在累积同在。';
  }
  if(html){ det.innerHTML = html; det.hidden = false; } else det.hidden = true;
  var row = $('#p-row');
  if(nd.status === 'future'){
    row.innerHTML = '<span class="pgo ghost">预留位</span><span class="pst future">未来产物</span>';
  }else{
    row.innerHTML = '<a class="pgo" href="' + nd.href + '" target="_blank" rel="noopener">进入</a>' +
      '<span class="pst ' + (nd.status === 'active' ? 'on' : '') + '">' + (nd.status === 'active' ? '在线' : '已合入') + '</span>';
  }
  var el = $('#panel');
  el.hidden = false;
  if(bloom){
    el.classList.remove('bloom');
    void el.offsetWidth;
    el.classList.add('bloom');
  }
  positionPanel(true);
  needsDraw();
}
function positionPanel(force){
  if(!PANEL_ND || $('#panel').hidden) return;
  var p = [PANEL_ND._sx || VW / 2, PANEL_ND._sy || VH / 2];
  var el = $('#panel');
  var w = el.offsetWidth || 300, h = el.offsetHeight || 190;
  var x, y;
  if(p[0] > VW * 0.62){ x = p[0] - w - 20; el.style.transformOrigin = (w + 18) + 'px ' + (h / 2) + 'px'; }
  else { x = p[0] + 20; el.style.transformOrigin = '-16px ' + (h / 2) + 'px'; }
  y = clamp(p[1] - h / 2, 62, Math.max(62, VH - h - 10));
  el.style.left = clamp(x, 10, Math.max(10, VW - w - 10)) + 'px';
  el.style.top = y + 'px';
  if(force && (p[0] < -60 || p[0] > VW + 60)) showToast('节点在视野边缘——Home 回全览再找它');
}
$('#p-close').addEventListener('click', function(){ PANEL_ND = null; $('#panel').hidden = true; needsDraw(); });
function closeAll(){
  PANEL_ND = null; $('#panel').hidden = true;
  LAW = null; $('#lawcard').hidden = true;
  needsDraw();
}

/* ---------- 一切之门（G 键·全部产物索引） ---------- */
var GATE_CARDS = [];
function buildGate(){
  var field = $('#gate-field');
  var byRing = {};
  NODES.forEach(function(nd){
    var s = Math.round(nd.scale);
    (byRing[s] = byRing[s] || []).push(nd);
  });
  Object.keys(byRing).map(Number).sort(function(a,b){ return a - b; }).forEach(function(s){
    var card = document.createElement('div');
    card.className = 'gcard';
    card.style.setProperty('--d', (s * 42) + 'ms');
    var h = '<div class="ghead"><span class="gring">' + SCALES[s].name + '</span><span class="gsize">' + SCALES[s].size + '</span></div>';
    byRing[s].forEach(function(nd){
      h += '<button class="gnd ' + nd.status + '" data-id="' + nd.id + '"><i></i>' + nd.name + '</button>';
    });
    card.innerHTML = h;
    card._s = s;
    field.appendChild(card);
    GATE_CARDS.push(card);
  });
  $('#gate-sub').textContent = '虫洞喉 · ' + NODES.length + ' 个产物从这里可达';
  field.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.gnd') : null;
    if(!b) return;
    var nd = null;
    for(var i = 0; i < NODES.length; i++) if(NODES[i].id === b.dataset.id){ nd = NODES[i]; break; }
    if(!nd) return;
    closeGate();
    if(nd.status === 'future'){
      setTimeout(function(){ showToast(nd.name + ' · 预留位（未来产物）'); }, 420);
      return;
    }
    setTimeout(function(){ warpToNode(nd); }, 240);
  });
}
function layoutGate(){
  if(!GATE_CARDS.length) return;
  var small = Math.min(VW, VH) < 600;
  $('#gate').classList.toggle('small', small);
  var minD = Math.min(VW, VH);
  GATE_CARDS.forEach(function(c){
    if(small){ c.style.removeProperty('--dx'); c.style.removeProperty('--dy'); return; }
    var s = c._s;
    var th = -Math.PI / 2 + s * TAU / 12;
    var r = gateR(s) * minD;
    c.style.setProperty('--dx', (Math.cos(th) * r).toFixed(1) + 'px');
    c.style.setProperty('--dy', (Math.sin(th) * r).toFixed(1) + 'px');
  });
}
function openGate(){
  closeAll();
  layoutGate();
  var g = $('#gate');
  g.hidden = false;
  g.scrollTop = 0;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ g.classList.add('on'); }); });
}
function closeGate(){
  var g = $('#gate');
  if(g.hidden) return;
  g.classList.remove('on');
  setTimeout(function(){ g.hidden = true; }, 560);
}
$('#gate-close').addEventListener('click', closeGate);

/* ---------- 键盘可达入口清单（视觉隐藏） ---------- */
function buildSrLinks(){
  var nav = $('#srlinks');
  NODES.filter(function(nd){ return nd.status !== 'future'; }).forEach(function(nd){
    var a = document.createElement('a');
    a.href = nd.href; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = nd.name + '（' + ringLabel(nd) + '）';
    nav.appendChild(a);
    nav.appendChild(document.createTextNode(' '));
  });
}

/* ---------- 提示 ---------- */
var hintOff = false;
function dismissHint(){
  if(hintOff) return;
  hintOff = true;
  $('#hint').classList.add('off');
}
setTimeout(dismissHint, 10000);

/* ---------- 浏览器侧审美审计 ---------- */
function browserAudit(){
  try{
    var names = {};
    for(var si = 0; si < document.styleSheets.length; si++){
      var rules = document.styleSheets[si].cssRules;
      for(var ri = 0; ri < rules.length; ri++){
        var st = rules[ri].style;
        if(!st) continue;
        for(var pi = 0; pi < st.length; pi++){
          var prop = st[pi];
          if(prop && prop.indexOf('--') === 0) names[prop] = 1;
        }
      }
    }
    var got = Object.keys(names);
    if(got.length !== COLOR_TOKENS.length){
      console.warn('审美审计：CSS token 数=' + got.length + '（应为 5）：' + got.join(','));
    }else{
      console.log('审美审计 ✓ 5 色 token · 闭环粒子 ' + FLOW_N + '（≤400）· 翻面 ' + WARP_MS + 'ms · 喉 r0=' + R0 + ' · 螺线 ' + NW + ' 绕/圈 · φ=' + PHI.toFixed(10));
    }
  }catch(e){}
}

/* ==========================================================
   主循环（缓慢自转 95s/圈·惯性·reduced-motion 静帧）
   ========================================================== */
var lastT = performance.now();
function frame(t){
  var dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;
  if(!REDUCE){
    var idle = pointers.size === 0 && !panelOpen() && !lawOpen() && !FLY && !FLIP && !gateOpen();
    if(idle) cam.yaw += TAU * dt / 95;
    if(inertiaOn){
      cam.yaw += yawV * dt;
      cam.pitch = clamp(cam.pitch + pitchV * dt, -1.25, 1.25);
      yawV *= Math.exp(-3.2 * dt); pitchV *= Math.exp(-3.2 * dt);
      if(Math.abs(yawV) < 0.02 && Math.abs(pitchV) < 0.02) inertiaOn = false;
    }
    stepFly(t);
    DRAW = true;
  }else{
    stepFly(t);
  }
  stepFlip(t);
  if(DRAW){ render(t); DRAW = REDUCE ? false : true; }
  requestAnimationFrame(frame);
}

/* ---------- 启动 ---------- */
function init(){
  bindTheme();
  bindTTS();
  bindHeartBadge();
  $('#credo-note').textContent = CREDO_TEXT;
  buildGate();
  buildSrLinks();
  resize();
  window.addEventListener('resize', resize);
  $('#brand').addEventListener('click', function(){ if(gateOpen()) closeGate(); else goHome(); });
  browserAudit();
  requestAnimationFrame(frame);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
